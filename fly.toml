# Fly.io config (used by `fly launch --copy-config` / `fly deploy`). App name must be globally unique.
app = "treeni-liukuri"
primary_region = "arn"   # Stockholm, closest to Helsinki

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
